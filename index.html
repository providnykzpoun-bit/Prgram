    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            text-align: center;
            padding: 10px 10px 80px 10px;
            margin: 0;
            user-select: none;
        }
        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c2536;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;

        }
        .user-box { text-align: left; }
        .user-name { font-size: 1em; color: #00ffcc; font-weight: bold; }
        .status-offline {

            color: white;

            display: inline-block;
            margin-top: 3px;
        }
        .card {

        .balance { font-size: 2em; color: #00ffcc; margin: 5px 0; font-weight: bold; }
        .claim-box {
            background: linear-gradient(135deg, #0f2824, #153e36);
            border: 1px solid #00ffcc;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .claim-amount { color: #00ffcc; font-size: 1.2em; font-weight: bold; }
        .btn-claim {
            background: linear-gradient(to bottom, #ffd700, #ffaa00);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4);
            transition: 0.1s;
        }
        .btn-claim:active { transform: scale(0.97); }
        
        .coin-container {
            position: relative;
            display: inline-block;
            margin: 15px 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-svg {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            transition: transform 0.08s ease;
        }
        .coin-container:active .coin-svg { transform: scale(0.92); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #00ffcc;
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        .profile-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #22303c;
            font-size: 0.95em;
        }
        .profile-label { color: #8a9ba8; }
        .profile-value { color: #00ffcc; font-weight: bold; }
        .profile-rank {
            background: linear-gradient(90deg, #0088cc, #00ffcc);
            color: #000;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 15px;
            display: inline-block;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .boost-card {
            background: #111823;
            border: 1px solid #00ffcc33;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .boost-title { font-weight: bold; color: #00ffcc; text-align: left; }
        .boost-desc { font-size: 0.8em; color: #8a9ba8; text-align: left; }
        .btn-buy {
            background: #0088cc;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-invite {
            background: linear-gradient(90deg, #0088cc, #00ffcc);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* Стилі завдань */
        .task-card {

            border: 1px solid #00ffcc33;
            border-radius: 10px;
            padding: 12px;

            justify-content: space-between;
            align-items: center;
        }

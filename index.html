<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prgram Mining & TON Wallet</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #1c2536;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .user-info {
            font-size: 1.2em;
            color: #0088cc;
            font-weight: bold;
        }
        .btn-mine {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            max-width: 300px;
        }
        .btn-mine:active {
            transform: scale(0.95);
            background-color: #006699;
        }
        .balance {
            font-size: 2em;
            color: #00ffcc;
            margin: 15px 0;
        }
        .wallet-address {
            font-size: 0.8em;
            word-break: break-all;
            color: #aaaaaa;
            margin-top: 10px;
        }
        #ton-connect-btn {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h2>Prgram Mini App</h2>

    <!-- Відображення профілю Telegram -->
    <div class="card">
        <div>Користувач:</div>
        <div id="user-display" class="user-info">Завантаження...</div>
    </div>

    <!-- Кнопка підключення TON Гаманця -->
    <div id="ton-connect-btn"></div>

    <!-- Блок Майнінгу -->
    <div class="card">
        <h3>Майнінг баланс</h3>
        <div id="balance" class="balance">0.0000 UA</div>
        <button class="btn-mine" onclick="mine()">Майнити</button>
    </div>

    <!-- Інформація про гаманець призначення -->
    <div class="card">
        <div>Гаманець для виплат:</div>
        <div class="wallet-address">UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw</div>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userDisplay = document.getElementById('user-display');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const username = user.username ? `@${user.username}` : `${user.first_name} ${user.last_name || ''}`;
            userDisplay.innerText = username;
        } else {
            userDisplay.innerText = "Гість (поза Telegram)";
        }

        // Ініціалізація TON Connect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Prgram/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        // Простий майнінг (клікер)
        let count = 0;
        function mine() {
            count += 0.0001;
            document.getElementById('balance').innerText = count.toFixed(4) + " UA";
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>

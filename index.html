<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PR GRAM Mining</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        .card {
            background: #1c2536;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .user-info {
            font-size: 1.1em;
            color: #0088cc;
            font-weight: bold;
            margin-top: 5px;
        }
        .balance {
            font-size: 2.2em;
            color: #00ffcc;
            margin: 10px 0;
            font-weight: bold;
        }
        #ton-connect-btn {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        /* Стилі монети */
        .coin-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-svg {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            transition: transform 0.08s ease;
        }
        .coin-container:active .coin-svg {
            transform: scale(0.92);
        }
        /* Анімація вильоту числа */
        .click-text {
            position: absolute;
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-70px); }
        }
    </style>
</head>
<body>

    <h2>PR GRAM Mining</h2>

    <!-- Профіль користувача -->
    <div class="card">
        <div>Пользователь:</div>
        <div id="user-display" class="user-info">Загрузка...</div>
    </div>

    <!-- Кнопка підключення TON Гаманця -->
    <div id="ton-connect-btn"></div>

    <!-- Блок Майнінгу -->
    <div class="card">
        <h3>Баланс майнинга</h3>
        <div id="balance" class="balance">0.0000 PR GRAM</div>
        
        <!-- Монетка з намальованим логотипом -->
        <div class="coin-container" onclick="mine(event)">
            <svg class="coin-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Зовнішній круг монети -->
                <circle cx="100" cy="100" r="96" fill="#000000" stroke="#00ffcc" stroke-width="6"/>
                <!-- Внутрішнє рамкове кільце -->
                <circle cx="100" cy="100" r="88" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
                
                <!-- Логотип PR GRAM (Bubble + Checkmark) -->
                <g fill="#ffffff" transform="translate(42, 42) scale(0.23)">
                    <path d="M 400 200 C 400 310.457 310.457 400 200 400 C 158.5 400 120.3 387.4 88.6 365.8 L 0 400 L 34.2 311.4 C 12.6 279.7 0 241.5 0 200 C 0 89.543 89.543 0 200 0 C 310.457 0 400 89.543 400 200 Z" fill="none" stroke="#ffffff" stroke-width="42" stroke-linejoin="round" stroke-linecap="round"/>
                    <path d="M 120 200 L 180 260 L 310 130" fill="none" stroke="#ffffff" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </svg>
        </div>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userDisplay = document.getElementById('user-display');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const username = user.username ? `@${user.username}` : `${user.first_name} ${user.last_name || ''}`;
            userDisplay.innerText = username;
        } else {
            userDisplay.innerText = "Гость (вне Telegram)";
        }

        // Ініціалізація TON Connect з російською мовою
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Prgram/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn',
            uiPreferences: {
                lang: 'ru'
            }
        });

        // Генерація звуку "дзень" через Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCoinSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(2400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // Логіка майнінгу
        let count = 0;
        function mine(event) {
            count += 0.0001;
            document.getElementById('balance').innerText = count.toFixed(4) + " PR GRAM";

            // Звук
            playCoinSound();

            // Вібрація в Telegram
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Анімація вильоту +0.0001
            showFloatingText(event);
        }

        function showFloatingText(e) {
            const container = document.querySelector('.coin-container');
            const rect = container.getBoundingClientRect();
            const text = document.createElement('div');
            text.className = 'click-text';
            text.innerText = '+0.0001';
            
            const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
            const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
            
            text.style.left = `${x}px`;
            text.style.top = `${y}px`;

            container.appendChild(text);

            setTimeout(() => {
                text.remove();
            }, 800);
        }
    </script>
</body>
</html>
